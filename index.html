<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אנשי קשר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--or:#FF7A1A;--or2:#FF9D4D;--sky:#5CC8FF;--bl:#1456F0;--wh:#fff;--ink:#000;--mist:#EAF6FF;--line:#E3EEF7;
box-sizing:border-box;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--wh);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden;background:#fff}
header{position:relative;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;background:linear-gradient(135deg,var(--or),var(--or2) 55%,#ffb36b);border-radius:0 0 34px 34px;overflow:hidden;flex:none;box-shadow:0 10px 30px -12px var(--or)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.9;animation:float 9s ease-in-out infinite}
.b1{width:170px;height:170px;background:var(--sky);left:-50px;top:-70px}
.b2{width:120px;height:120px;background:var(--bl);left:90px;top:40px;animation-delay:-3s;opacity:.85}
.b3{width:80px;height:80px;background:#fff;left:-20px;top:70px;animation-delay:-6s;opacity:.55}
@keyframes float{50%{transform:translate(26px,18px) scale(1.12) rotate(20deg)}}
.hrow{position:relative;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-weight:900;font-size:38px;letter-spacing:-1px;color:#000;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.count{position:relative;color:#000;font-weight:600;margin-top:2px}
.chip{background:#fff;border-radius:50px;padding:6px 14px;font-weight:800;box-shadow:0 4px 0 var(--bl)}
.chips{position:relative;display:flex;gap:8px;margin-top:14px}
.tab{background:rgba(255,255,255,.55);padding:7px 16px;border-radius:30px;font-weight:600;transition:.25s}
.tab.on{background:#000;color:#fff;transform:scale(1.06)}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 calc(130px + env(safe-area-inset-bottom,0px));scroll-behavior:smooth}
.sec{position:sticky;top:0;background:linear-gradient(#fff 70%,#fff0);padding:14px 22px 6px;font-weight:900;font-size:20px;color:var(--bl);z-index:2}
.row{display:flex;align-items:center;gap:14px;padding:10px 22px;margin:0 8px;border-radius:20px;width:calc(100% - 16px);text-align:right;transition:transform .2s,background .2s}
.row:active{transform:scale(.96);background:var(--mist)}
.row.in{animation:rise .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateX(40px) scale(.9)}}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;background:linear-gradient(145deg,var(--sky),var(--bl));box-shadow:inset 0 -6px 12px rgba(0,0,0,.18)}
.av.o{background:linear-gradient(145deg,var(--or2),var(--or))}
.nm{font-weight:800;font-size:18px;flex:1}
.nm small{display:block;font-weight:400;opacity:.55;font-size:13px}
.star{color:var(--or);font-size:18px}
.idx{position:absolute;left:2px;top:50%;transform:translateY(-45%);display:flex;flex-direction:column;gap:3px;z-index:5;font-size:11px;font-weight:800;color:var(--bl)}
.idx button{padding:1px 6px;transition:.15s}.idx button:active{transform:scale(1.9);color:var(--or)}
.empty{text-align:center;padding:60px 30px;font-weight:600;opacity:.7}
.dock{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:14px;left:14px;display:flex;gap:10px;align-items:center;z-index:6}
.fab{width:56px;height:56px;border-radius:50%;background:#000;color:#fff;font-size:30px;line-height:1;box-shadow:0 5px 0 var(--or),0 14px 24px -8px #0006;transition:.2s;flex:none}
.fab:active{transform:translateY(4px);box-shadow:0 1px 0 var(--or)}
.sbar{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:40px;height:56px;padding:0 20px;box-shadow:0 0 0 2px var(--sky),0 12px 26px -10px #1456f055;transition:.3s}
.sbar:focus-within{box-shadow:0 0 0 3px var(--or),0 12px 30px -8px #ff7a1a88;transform:scale(1.02)}
.sbar input{flex:1;border:0;outline:0;font:inherit;font-size:17px;background:none;color:#000;min-width:0}
.sbar svg{width:22px;stroke:var(--bl)}
.sheet{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1);overflow-y:auto;border-radius:30px 30px 0 0}
.sheet.open{transform:none}
.hero{position:relative;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 70px;background:linear-gradient(160deg,var(--bl),var(--sky));overflow:hidden;text-align:center;flex:none}
.hero .b1{background:var(--or);left:auto;right:-40px;top:-60px}.hero .b2{background:var(--or2);left:-20px;top:100px;width:100px;height:100px}
.top{position:relative;display:flex;justify-content:space-between}
.pill{background:#fff;border-radius:30px;padding:8px 18px;font-weight:800;box-shadow:0 3px 0 #000;transition:.15s}.pill:active{transform:translateY(3px);box-shadow:none}
.big{position:relative;width:128px;height:128px;margin:6px auto 12px;font-size:56px;border:5px solid #fff;background:linear-gradient(145deg,var(--or2),var(--or))}
.open .big{animation:pop .7s cubic-bezier(.2,1.6,.3,1) .15s both}
@keyframes pop{from{transform:scale(0) rotate(-120deg)}}
.hero h2{position:relative;margin:0;font-size:30px;font-weight:900;color:#000;text-shadow:0 2px 0 #fff8}
.acts{display:flex;justify-content:center;gap:14px;margin:-38px 16px 0;position:relative}
.act{width:68px;height:68px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--or),0 16px 24px -10px #0005;transition:.15s;font-size:11px;font-weight:800}
.act svg{width:26px;height:26px;display:block;margin:0 auto 4px;fill:none;stroke:var(--bl);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.act:active{transform:translateY(5px);box-shadow:0 1px 0 var(--or)}
.card{margin:18px 18px 0;background:var(--mist);border-radius:24px;padding:16px 20px}
.card b{display:block;color:var(--bl);font-size:13px}
.card div{font-size:20px;font-weight:600;direction:ltr;text-align:right}
.card.w{background:#fff;box-shadow:0 0 0 2px var(--line);padding:6px}
.card.w button{display:block;width:100%;text-align:right;padding:14px;font-weight:800;border-radius:18px}
.card.w button:active{background:var(--mist)}
.card.w .del{color:#000;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:12px;padding:18px}
.f input{border:0;outline:0;font:inherit;font-size:18px;color:#000;background:var(--mist);border-radius:18px;padding:16px 18px;transition:.2s}
.f input:focus{box-shadow:0 0 0 3px var(--or);background:#fff}
.call{position:absolute;inset:0;z-index:40;background:linear-gradient(180deg,var(--bl),#000);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.call.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.ring{position:relative;width:130px;height:130px;margin-bottom:20px}
.ring i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--sky);animation:wave 2s infinite}
.ring i:nth-child(2){animation-delay:.6s;border-color:var(--or)}.ring i:nth-child(3){animation-delay:1.2s}
@keyframes wave{from{transform:scale(.7);opacity:1}to{transform:scale(2.2);opacity:0}}
.ring .av{width:130px;height:130px;font-size:56px;position:relative}
.end{margin-top:40px;width:72px;height:72px;border-radius:50%;background:var(--or);font-size:30px;box-shadow:0 5px 0 #000}
.toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-90px);background:#000;color:#fff;padding:12px 22px;border-radius:30px;font-weight:800;z-index:60;transition:.45s cubic-bezier(.2,1.5,.3,1);border-bottom:4px solid var(--or)}
.toast.on{transform:translate(-50%,0)}
.chips{overflow-x:auto;max-height:60px;padding:2px 2px 6px;transition:max-height .4s,opacity .3s,margin .4s;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips.w{flex-wrap:wrap;max-height:none;overflow:visible}
header::after{content:"";position:absolute;inset:0;background:radial-gradient(circle 170px at var(--mx,50%) var(--my,0),#fffa,transparent);pointer-events:none;mix-blend-mode:soft-light}
header.sm .chips{max-height:0;opacity:0;margin-top:0;padding:0}header.sm h1{font-size:26px}h1{transition:font-size .4s}
.cb{flex:none;background:rgba(255,255,255,.55);padding:7px 16px;border-radius:30px;font-weight:600;transition:.25s}.cb.on{background:#000;color:#fff;transform:scale(1.06)}.f .cb{background:var(--mist)}.f .cb.on{background:#000}
.row,.act,.fab,.pill,.cb,.cd{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:var(--sky);opacity:.5;transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.strip{flex:none;display:flex;gap:14px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none}.strip:empty{display:none}
.bub{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12px;animation:bub .6s cubic-bezier(.2,1.8,.3,1) both}.bub .av{width:58px;height:58px;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--or);transition:.2s}.bub:active .av{transform:scale(.88)}@keyframes bub{from{transform:scale(0) translateY(30px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px}
.cd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px 16px;border-radius:30px;background:var(--mist);box-shadow:0 6px 0 var(--sky);transition:transform .25s,box-shadow .25s}.cd:nth-child(3n+1){background:#FFF1E4;box-shadow:0 6px 0 var(--or)}
.cd .av{width:70px;height:70px;font-size:30px}.cd b{font-weight:800;font-size:16px;text-align:center}.cd small{opacity:.6;direction:ltr}.cd .star{position:absolute;top:12px;left:14px}
.cd.in{animation:pop2 .6s cubic-bezier(.2,1.5,.3,1) both}@keyframes pop2{from{opacity:0;transform:scale(.4) rotate(-14deg)}}.cd:active{transform:scale(.93)}
.tag{font-style:normal;font-size:11px;font-weight:800;background:#000;color:#fff;border-radius:20px;padding:2px 10px}.hero .tag{position:relative;background:#fff;color:#000;display:inline-block;margin-top:8px;padding:4px 14px}
.row.cp{padding:4px 22px}.row.cp .av{width:36px;height:36px;font-size:16px}.row.cp .nm{font-size:16px}.row.cp small{display:none}
.hl{background:var(--or)!important;transform:scale(1.06)}
.fab.r{background:var(--bl);box-shadow:0 5px 0 #000,0 14px 24px -8px #0006}.fab.r svg{width:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sw{flex:none;width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 3px #fff;transition:.2s}.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #000;transform:scale(1.15)}
.th{flex:none;padding:16px 20px;border-radius:22px;font-weight:800;color:#000;transition:.25s}.th.on{box-shadow:0 0 0 4px #000;transform:scale(1.06)}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.open .big.spin{animation:spin .9s cubic-bezier(.2,1.4,.3,1)}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#cf{position:fixed;inset:0;z-index:70;pointer-events:none}.noan .blob{animation:none}.f b{color:var(--bl)}.card.cc{cursor:pointer}
.sheet{overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}.row{min-width:0}.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cd{min-width:0}.cd b{max-width:100%;overflow-wrap:anywhere}.sbar{min-width:0}.idx{max-height:60%;justify-content:space-between}
@media (max-height:700px){.idx{font-size:9px;gap:1px}.big{width:100px;height:100px;font-size:44px}}
@media (max-width:380px){.acts{gap:8px}.act{width:60px;height:60px}h1{font-size:32px}}
mark{background:var(--or);color:#000;border-radius:6px;padding:0 3px}
.hero .big::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:3px solid #fff;opacity:0;animation:pl 2.4s ease-out infinite}@keyframes pl{from{transform:scale(.85);opacity:.9}to{transform:scale(1.5);opacity:0}}
.bub .av{animation:bob 3.4s ease-in-out infinite}.bub:nth-child(2n) .av{animation-delay:-1.7s}@keyframes bob{50%{transform:translateY(-5px)}}
.disco header,.disco .av:not(.big){animation:hue 6s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.wv span{display:inline-block;animation:wv .7s calc(var(--i)*60ms) both}@keyframes wv{40%{transform:translateY(-16px) rotate(-10deg) scale(1.2)}}h1{cursor:pointer}
.idx{touch-action:none}.lb{position:absolute;top:50%;left:50%;width:120px;height:120px;margin:-60px;border-radius:36px;background:var(--or);color:#000;font-size:70px;font-weight:900;display:grid;place-items:center;z-index:30;opacity:0;pointer-events:none;box-shadow:0 8px 0 #000}.lb.on{animation:lbp .9s ease-out}@keyframes lbp{0%{opacity:0;transform:scale(.3) rotate(-20deg)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
.row{touch-action:pan-y}
.strip{transition:max-height .4s,padding .4s;max-height:120px}.strip.hid{max-height:0;padding-top:0;padding-bottom:0;overflow:hidden}
@media (max-height:760px){.bub .av{width:46px;height:46px;font-size:18px}.strip{padding-top:8px}}
.tot{text-align:center;padding:12px;font-weight:800;color:var(--bl)}main{-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <div class="hrow"><h1>אנשי קשר</h1><div style="display:flex;gap:8px;align-items:center"><button class="chip" id="set">עיצוב</button><div class="chip" id="cnt">0</div></div></div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="strip" id="strip"></div><main id="list"></main>
  <nav class="idx" id="idx"></nav>
  <div class="dock">
    <button class="fab" id="add" aria-label="איש קשר חדש">+</button><button class="fab r" id="rnd" aria-label="אקראי"><svg viewBox="0 0 24 24"><path d="M3 7h4l8 10h6M3 17h4l3-4M13 9l2-2h6M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
    <label class="sbar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="חיפוש" autocomplete="off"></label>
  </div>

  <section class="sheet" id="detail"></section>

  <section class="sheet" id="form">
    <div class="hero" style="padding-bottom:30px"><i class="blob b1"></i><div class="top"><button class="pill" id="fx">ביטול</button><button class="pill" id="fs" style="background:var(--or)">שמירה</button></div>
      <div class="av big" id="fav" style="margin-top:14px">+</div><h2>איש קשר חדש</h2></div>
    <div class="f"><input id="fn" placeholder="שם מלא"><input id="fp" placeholder="מספר נייד" inputmode="tel" dir="rtl"><input id="fe" placeholder="אימייל" inputmode="email" dir="rtl"><b>קבוצה</b><div class="chips w" id="fg"></div><b>צבע אווטאר</b><div class="chips w" id="fc"></div></div>
  </section>

  <section class="sheet" id="sets"></section><canvas id="cf"></canvas><div class="call" id="call"><div class="ring"><i></i><i></i><i></i><div class="av big" id="cav" style="margin:0"></div></div><h2 id="cn" style="margin:0;font-size:32px;font-weight:900"></h2><div>מתקשר…</div><button class="end" id="end"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let C=[
{id:1,n:'אבא',p:'050-1112233',f:1},{id:2,n:'אמא',p:'052-4445566',f:1},{id:3,n:'אגם אחותי',p:'054-7778899',f:1},
{id:4,n:'אביב מהכיתה',p:'053-5418187'},{id:5,n:'אורי אוחנה מהכיתה',p:'050-2223344'},{id:6,n:'דריה מהכיתה',p:'052-6667788'},
{id:7,n:'הילי',p:'054-1239876'},{id:8,n:'המורה אסתר',p:'050-9998877'},{id:9,n:'טמיר',p:'053-1357913'},
{id:10,n:'יובל מהכיתה',p:'052-2468024'},{id:11,n:'מאי מהכיתה',p:'054-8642097'},{id:12,n:'מארק',p:'050-3692581'},{id:13,n:'מיה',p:'053-1472583'}];
try{const s=localStorage.getItem('contacts_v1');if(s)C=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('contacts_v1',JSON.stringify(C))}catch(e){}};
let tab='all',first=true,cur=null;
const letter=n=>n.trim()[0]||'#';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function render(){
  const q=$('#q').value.trim();
  let L=C.filter(c=>(tab==='all'||c.f)&&(!q||c.n.includes(q)||(/\d/.test(q)&&c.p.replace(/\D/g,'').includes(q.replace(/\D/g,'')))));
  L.sort((a,b)=>a.n.localeCompare(b.n,'he'));
  $('#cnt').textContent=C.length;
  let h='',last='',i=0,keys=[];
  if(!L.length)h='<div class="empty">לא נמצאו אנשי קשר.<br>לחצו על + כדי להוסיף.</div>';
  L.forEach(c=>{const l=letter(c.n);if(l!==last){last=l;keys.push(l);h+=`<div class="sec" id="s-${l}">${l}</div>`}
    h+=`<button class="row ${first?'in':''}" style="animation-delay:${Math.min(i++,14)*45}ms" data-id="${c.id}"><div class="av ${c.id%2?'':'o'}">${letter(c.n)}</div><div class="nm">${c.n}<small>${c.p}</small></div>${c.f?'<svg class="star" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 .6-5.4 4.7 1.7 7.2L12 17.8 5.7 21.500l1.700-7.200L2 9.600 9 9z"/></svg>':''}</button>`});
  $('#list').innerHTML=h;first=false;
  $('#idx').innerHTML=keys.map(k=>`<button data-k="${k}">${k}</button>`).join('');
}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openD(+r.dataset.id)};
$('#idx').onclick=e=>{const k=e.target.dataset.k;if(k)$('#s-'+k)?.scrollIntoView({behavior:'smooth'})};
$('#q').oninput=render;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render()});
function openD(id){
  cur=C.find(c=>c.id===id);const d=$('#detail');
  d.innerHTML=`<div class="hero"><i class="blob b1"></i><i class="blob b2"></i><div class="top"><button class="pill" id="back">חזרה</button><button class="pill" id="fv">${cur.f?'מועדף':'הוסף למועדפים'}</button></div>
  <div class="av big">${letter(cur.n)}</div><h2>${cur.n}</h2></div>
  <div class="acts"><button class="act" data-a="msg"><div><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>הודעה</div></button><button class="act" data-a="call"><div><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/></svg>התקשר</div></button><button class="act" data-a="vid"><div><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg>וידאו</div></button><button class="act" data-a="mail"><div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>מייל</div></button></div>
  <div class="card"><b>נייד</b><div>${cur.p}</div></div>
  <div class="card w"><button id="sh">שיתוף איש הקשר</button><button class="del" id="dl">מחיקת איש קשר</button></div><div style="height:40px"></div>`;
  requestAnimationFrame(()=>d.classList.add('open'));
  $('#back').onclick=()=>d.classList.remove('open');

document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const have=new Set(C.map(c=>c.n+'|'+c.p));let n=0;String(rd.result).split(/BEGIN:VCARD/i).slice(1).forEach((v,i)=>{v=v.replace(/\r?\n[ \t]/g,'');const nm=(v.match(/^FN[^:\n]*:(.*)$/m)||[])[1],tl=(v.match(/^(?:item\d+\.)?TEL[^:\n]*:(.*)$/m)||[])[1],em=(v.match(/^(?:item\d+\.)?EMAIL[^:\n]*:(.*)$/m)||[])[1];if(!nm)return;const name=nm.trim(),p=(tl||'—').trim(),k=name+'|'+p;if(have.has(k))return;have.add(k);C.push({id:Date.now()+i,n:name,p,e:(em||'').trim(),h:i%4});n++});save();ani=1;render();toast('יובאו '+n+' אנשי קשר')};rd.readAsText(f);e.target.value=''});
seed();
applyCfg();render();
try{if(!localStorage.getItem('hint_v1')){localStorage.setItem('hint_v1','1');setTimeout(()=>toast('החלק שורה ימינה להתקשר, שמאלה למועדפים'),1200)}}catch(e){}
</script>
